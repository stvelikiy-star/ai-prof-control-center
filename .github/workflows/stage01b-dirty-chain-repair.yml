name: One-shot Stage01B dirty-chain repair

on:
  push:
    branches:
      - fix/stage01b-dirty-chain-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified repair
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('orchestrator/control_loop.py')
          text = path.read_text(encoding='utf-8')

          old = '''    return [
              ("operations", [python, str(root / "orchestrator/operations_runner.py"), "--root", base, "--state-root", str(runtime)]),
              ("stage_01a", [python, str(root / "orchestrator/orchestrator.py"), "--root", base, "--state-root", str(runtime)]),
              ("auto_repair", [python, str(root / "orchestrator/auto_repair_runner.py"), "--root", base, "--state-root", str(runtime), "--once"]),
              ("codex_stage_01b", [python, str(root / "orchestrator/codex_stage01b_runner.py"), "--root", base, "--state-root", str(runtime)]),
              ("codex", [python, str(root / "orchestrator/codex_runner.py"), "--root", base, "--state-root", str(runtime), "--once"]),
          ]
          '''

          new = '''    return [
              ("auto_repair_pre", [python, str(root / "orchestrator/auto_repair_runner.py"), "--root", base, "--state-root", str(runtime), "--once"]),
              ("operations", [python, str(root / "orchestrator/operations_runner.py"), "--root", base, "--state-root", str(runtime)]),
              ("stage_01a", [python, str(root / "orchestrator/orchestrator.py"), "--root", base, "--state-root", str(runtime)]),
              ("codex_stage_01b", [python, str(root / "orchestrator/codex_stage01b_runner_v2.py"), "--root", base, "--state-root", str(runtime)]),
              ("auto_repair_post", [python, str(root / "orchestrator/auto_repair_runner.py"), "--root", base, "--state-root", str(runtime), "--once"]),
              ("codex", [python, str(root / "orchestrator/codex_runner.py"), "--root", base, "--state-root", str(runtime), "--once"]),
          ]
          '''

          if old not in text:
              raise SystemExit('control_loop child_commands block mismatch')
          text = text.replace(old, new, 1)

          old_self = '''        if [name for name, _ in child_commands(root, paths.state.parent)] != ["operations", "stage_01a", "auto_repair", "codex_stage_01b", "codex"]:
              raise RuntimeError("SELF_TEST_STAGE_ORDER_FAILED")
          '''
          new_self = '''        if [name for name, _ in child_commands(root, paths.state.parent)] != ["auto_repair_pre", "operations", "stage_01a", "codex_stage_01b", "auto_repair_post", "codex"]:
              raise RuntimeError("SELF_TEST_STAGE_ORDER_FAILED")
          '''
          if old_self not in text:
              raise SystemExit('control_loop self-test block mismatch')
          text = text.replace(old_self, new_self, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_control_loop.py')
          text = path.read_text(encoding='utf-8')

          old_order = '["operations", "stage_01a", "auto_repair", "codex_stage_01b", "codex"]'
          new_order = '["auto_repair_pre", "operations", "stage_01a", "codex_stage_01b", "auto_repair_post", "codex"]'
          count = text.count(old_order)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stage-order assertions, found {count}')
          text = text.replace(old_order, new_order)

          old_failure = '''            with mock.patch.object(loop, "run_child", side_effect=[1, 1, 1, 1, 0]) as run:
                  self.assertEqual(loop.run_cycle(paths, 1), 0)
              self.assertEqual(run.call_count, 5)
          '''
          new_failure = '''            with mock.patch.object(loop, "run_child", side_effect=[1, 1, 1, 1, 1, 0]) as run:
                  self.assertEqual(loop.run_cycle(paths, 1), 0)
              self.assertEqual(run.call_count, 6)
          '''
          if old_failure not in text:
              raise SystemExit('task failure test block mismatch')
          text = text.replace(old_failure, new_failure, 1)

          marker = '    def test_stage01b_uses_v2_runner(self):\n'
          if marker not in text:
              needle = '    def test_infrastructure_result_stops_cycle(self):\n'
              if needle not in text:
                  raise SystemExit('Stage01B regression insertion point missing')
              addition = '''    def test_stage01b_uses_v2_runner(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      runtime = root / "state"
                      commands = dict(loop.child_commands(root, runtime))
                      argv = commands["codex_stage_01b"]
                      self.assertTrue(
                          any(
                              str(value).endswith(
                                  "orchestrator/codex_stage01b_runner_v2.py"
                              )
                              for value in argv
                          )
                      )
                      self.assertFalse(
                          any(
                              str(value).endswith(
                                  "orchestrator/codex_stage01b_runner.py"
                              )
                              for value in argv
                          )
                      )

          '''
              text = text.replace(needle, addition + needle, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path('orchestrator/auto_repair_runner.py')
          text = path.read_text(encoding='utf-8')

          needle = '''def git_run(project: Path, *args: str) -> subprocess.CompletedProcess[str]:
          '''
          helper = '''def path_within_scope(
              project: Path,
              relative: str,
              scope: tuple[str, ...],
          ) -> bool:
              """Accept an exact scoped file or a child of an existing scoped directory."""
              candidate = PurePosixPath(relative)
              for value in scope:
                  scoped = PurePosixPath(value)
                  if candidate == scoped:
                      return True
                  absolute = project / value
                  if absolute.is_dir() and scoped in candidate.parents:
                      return True
              return False


          def dirty_is_within_scope(
              project: Path,
              dirty: set[str],
              scope: tuple[str, ...],
          ) -> bool:
              return all(path_within_scope(project, relative, scope) for relative in dirty)


          def current_branch(project: Path) -> str:
              return git_run(project, "branch", "--show-current").stdout.strip()


          def candidate_branch_matches(project: Path, work_branch: str) -> bool:
              """Bind a dirty candidate to the exact task work branch."""
              return bool(work_branch) and current_branch(project) == work_branch


          def restore_terminal_base_branch(
              project: Path,
              base_branch: str,
              work_branch: str,
          ) -> None:
              """Return an exhausted clean candidate from its work branch to base."""
              if dirty_paths(project):
                  raise AutoRepairError(
                      "refusing terminal branch restore while repository is dirty"
                  )
              current = current_branch(project)
              if current == base_branch:
                  return
              if current != work_branch:
                  raise AutoRepairError(
                      f"refusing terminal branch restore from unexpected branch: {current}"
                  )
              git_run(project, "checkout", base_branch)
              actual = current_branch(project)
              if actual != base_branch:
                  raise AutoRepairError(
                      f"terminal branch restore did not reach base branch: {actual}"
                  )


          '''
          if 'def path_within_scope(' not in text:
              if needle not in text:
                  raise SystemExit('auto_repair helper insertion point missing')
              text = text.replace(needle, helper + needle, 1)

          old_restore = '''    scope_set = set(scope)
              if not dirty:
                  raise AutoRepairError("failed Stage 01B has no dirty implementation to restore")
              outside = sorted(dirty - scope_set)
              if outside:
          '''
          new_restore = '''    if not dirty:
                  raise AutoRepairError("failed Stage 01B has no dirty implementation to restore")
              outside = sorted(
                  relative
                  for relative in dirty
                  if not path_within_scope(project, relative, scope)
              )
              if outside:
          '''
          if old_restore not in text:
              raise SystemExit('restore_task_scope_to_head block mismatch')
          text = text.replace(old_restore, new_restore, 1)

          old_early = '''    current_attempt = review_attempt(task_text)
              next_attempt = current_attempt + 1
              if next_attempt > max_cycles:
                  return False
              project_raw = field(task_text, "Project-Path")
          '''
          new_early = '''    current_attempt = review_attempt(task_text)
              next_attempt = current_attempt + 1
              project_raw = field(task_text, "Project-Path")
          '''
          if old_early not in text:
              raise SystemExit('early max-cycle block mismatch')
          text = text.replace(old_early, new_early, 1)

          old_dirty = '''    scope = parse_scope_files(task_text)
              dirty = dirty_paths(project)
              if not dirty or not dirty.issubset(set(scope)):
                  return False

              backup = backup_evidence(paths, task, [log_01b])
          '''
          new_dirty = '''    scope = parse_scope_files(task_text)

              work_branch = field(task_text, "Work-Branch")
              base_branch = field(task_text, "Base-Branch")
              if not work_branch or not base_branch:
                  raise AutoRepairError("Base-Branch or Work-Branch is missing")

              if not candidate_branch_matches(project, work_branch):
                  return False

              dirty = dirty_paths(project)
              if not dirty or not dirty_is_within_scope(project, dirty, scope):
                  return False

              if next_attempt > max_cycles:
                  backup = backup_evidence(paths, task, [log_01b])
                  backup_failed_candidate(project, scope, backup)
                  restore_task_scope_to_head(project, scope)
                  restore_terminal_base_branch(project, base_branch, work_branch)

                  feedback = "\\n".join([
                      f"- Automatic-Repair-Cycle-Limit: {current_attempt}/{max_cycles}",
                      f"- Failed-Required-Check: `{command}`",
                      "- Repair-cycle limit reached; no uncontrolled retry was created.",
                      "- The terminal failed candidate was preserved in the auto-repair backup.",
                      "- The task scope was restored to clean HEAD.",
                      f"- The project was returned to base branch `{base_branch}`.",
                      "- The task remains failed and requires new evidence or an explicit later decision.",
                  ])
                  atomic_write(task, set_auto_feedback(task_text, feedback))
                  print("AUTO_REPAIR_CHECK_FAILURE_EXHAUSTED_CLEANED")
                  print(f"task_id={task_id}")
                  print(f"repair_cycle={current_attempt}/{max_cycles}")
                  print(f"failed_check={command}")
                  print(f"backup={backup}")
                  print(f"base_branch={base_branch}")
                  return True

              backup = backup_evidence(paths, task, [log_01b])
          '''
          if old_dirty not in text:
              raise SystemExit('recover_check_failure candidate block mismatch')
          text = text.replace(old_dirty, new_dirty, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_auto_repair_runner.py')
          text = path.read_text(encoding='utf-8')

          old_scope = "            scope = ('src/tracked.txt', 'src/new.txt')\n"
          new_scope = "            scope = ('src',)\n"
          if old_scope not in text:
              raise SystemExit('directory scope regression source mismatch')
          text = text.replace(old_scope, new_scope, 1)

          if 'def test_exhausted_check_failure_preserves_candidate_and_cleans_project' not in text:
              needle = "\n\nif __name__ == '__main__':\n"
              if needle not in text:
                  raise SystemExit('auto repair test insertion point missing')
              addition = '''
              def test_exhausted_check_failure_preserves_candidate_and_cleans_project(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      control = root / 'control'
                      project = root / 'project'
                      project.mkdir()
                      self._git_repo(project)
                      subprocess.run(['git', 'checkout', '-qb', 'feature/test'], cwd=project, check=True)
                      (project / 'src' / 'tracked.txt').write_text('terminal candidate\\n', encoding='utf-8')
                      (project / 'src' / 'new.txt').write_text('new terminal candidate\\n', encoding='utf-8')
                      paths = runner.build_paths(control, root / 'state')
                      task = paths.failed / 'TASK-EXHAUSTED.md'
                      task.write_text('\\n'.join([
                          'Task-ID: TASK-EXHAUSTED',
                          f'Project-Path: {project}',
                          'Base-Branch: main',
                          'Work-Branch: feature/test',
                          'Required-Checks: python3 -m unittest',
                          'Scope-Files: src',
                          'Codex-Review-Attempt: 1',
                          '',
                      ]), encoding='utf-8')
                      log = paths.logs / 'TASK-EXHAUSTED-01B-20260828T000000Z.log'
                      log.write_text('CODEX_STAGE01B_FAILED\\nCodexExecutionError: check failed: python3 -m unittest\\n', encoding='utf-8')
                      self.assertTrue(runner.recover_check_failure(paths, task, max_cycles=1))
                      self.assertEqual(runner.dirty_paths(project), set())
                      self.assertEqual(subprocess.run(['git', 'branch', '--show-current'], cwd=project, text=True, capture_output=True, check=True).stdout.strip(), 'main')
                      self.assertTrue(task.exists())
                      self.assertIn('Repair-cycle limit reached', task.read_text(encoding='utf-8'))
                      backups = list(paths.backups.glob('TASK-EXHAUSTED-*'))
                      self.assertEqual(len(backups), 1)
                      self.assertEqual((backups[0] / 'candidate/files/src/tracked.txt').read_text(encoding='utf-8'), 'terminal candidate\\n')
                      self.assertEqual((backups[0] / 'candidate/files/src/new.txt').read_text(encoding='utf-8'), 'new terminal candidate\\n')

              def test_check_failure_refuses_candidate_from_wrong_work_branch(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      control = root / 'control'
                      project = root / 'project'
                      project.mkdir()
                      self._git_repo(project)
                      subprocess.run(['git', 'checkout', '-qb', 'feature/other-task'], cwd=project, check=True)
                      (project / 'src' / 'tracked.txt').write_text('other task candidate\\n', encoding='utf-8')
                      paths = runner.build_paths(control, root / 'state')
                      task = paths.failed / 'TASK-BRANCH-BIND.md'
                      task.write_text('\\n'.join([
                          'Task-ID: TASK-BRANCH-BIND',
                          f'Project-Path: {project}',
                          'Base-Branch: main',
                          'Work-Branch: feature/test',
                          'Required-Checks: python3 -m unittest',
                          'Scope-Files: src',
                          '',
                      ]), encoding='utf-8')
                      log = paths.logs / 'TASK-BRANCH-BIND-01B-20260828T000000Z.log'
                      log.write_text('CODEX_STAGE01B_FAILED\\nCodexExecutionError: check failed: python3 -m unittest\\n', encoding='utf-8')
                      self.assertFalse(runner.recover_check_failure(paths, task, max_cycles=5))
                      self.assertEqual((project / 'src' / 'tracked.txt').read_text(encoding='utf-8'), 'other task candidate\\n')
                      self.assertEqual(subprocess.run(['git', 'branch', '--show-current'], cwd=project, text=True, capture_output=True, check=True).stdout.strip(), 'feature/other-task')
                      self.assertEqual(list(paths.backups.glob('TASK-BRANCH-BIND-*')), [])
          '''
              text = text.replace(needle, addition + needle, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile orchestrator/control_loop.py orchestrator/auto_repair_runner.py tests/test_control_loop.py tests/test_auto_repair_runner.py
          python3 -m unittest tests.test_control_loop tests.test_auto_repair_runner
          python3 orchestrator/control_loop.py --root "$PWD" --state-root /tmp/ai-prof-state --self-test
          python3 orchestrator/codex_stage01b_runner_v2.py --root "$PWD" --state-root /tmp/ai-prof-state --self-test
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check

      - name: Commit canonical repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage01b-dirty-chain-repair.yml
          git config user.name "ai-prof-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add orchestrator/control_loop.py orchestrator/auto_repair_runner.py tests/test_control_loop.py tests/test_auto_repair_runner.py .github/workflows/stage01b-dirty-chain-repair.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' orchestrator/auto_repair_runner.py orchestrator/control_loop.py tests/test_auto_repair_runner.py tests/test_control_loop.py | sort)"
          test "$changed" = "$expected"
          git commit -m "fix(control-center): harden Stage 01B recovery pipeline"
          git push origin HEAD:fix/stage01b-dirty-chain-v2
